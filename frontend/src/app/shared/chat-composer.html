<div class="composer-mode-switch" role="group" aria-label="Execution mode">
  <button type="button" [class.active]="vm.modelService.workflow() === 'standard'"
    [attr.aria-pressed]="vm.modelService.workflow() === 'standard'"
    (click)="vm.modelService.workflow.set('standard')">Normal</button>
  <button type="button" [class.active]="vm.modelService.workflow() === 'ccc-auto'"
    [attr.aria-pressed]="vm.modelService.workflow() === 'ccc-auto'"
    (click)="vm.modelService.workflow.set('ccc-auto')">CCC</button>
</div>
<div
  class="hero-pill-bar"
  [class.bottom-composer-pill]="!hero"
>
  <input #filePicker type="file" multiple hidden (change)="vm.filesService.uploadFile($event)" />
  <button
    class="pill-btn-icon pill-btn-plus"
    type="button"
    [disabled]="vm.filesService.uploading()"
    (click)="filePicker.click()"
    title="Attach files"
    aria-label="Attach files"
  >
    <svg lucidePlus [size]="18"></svg>
  </button>

  <div class="pill-input-wrap">
    <textarea
      #textarea
      class="pill-textarea"
      [(ngModel)]="vm.chatService.draft"
      (input)="resize()"
      (paste)="vm.filesService.onPaste($event)"
      placeholder="Describe the task..."
      aria-label="Message to assistant"
      rows="1"
      (keydown)="composerKey($event)"
    ></textarea>
    @if(voice.interim()){<span class="voice-preview" role="status">{{voice.interim()}}</span>}
    @if(voice.error()){<span class="voice-error" role="alert">{{voice.error()}}</span>}
    @if(voice.busy){<span class="voice-hint" role="status">{{voice.starting()?'Requesting permission…':voice.stopping()?'Finishing dictation…':'Listening · Russian'}}</span>}
    <button class="pill-btn-icon voice-button" type="button" [class.listening]="voice.busy" [disabled]="voice.stopping()" (click)="toggleVoice()" [attr.aria-pressed]="voice.busy" [attr.aria-label]="voice.busy?'Stop dictation':'Dictate in Russian'" [title]="voice.busy?'Stop dictation':'Dictation · Russian'">
      <svg lucideMic [size]="18"></svg>
    </button>
  </div>

  <button
    class="pill-btn-send"
    type="button"
    [disabled]="actionDisabled"
    (click)="performAction()"
    [title]="actionLabel"
    [attr.aria-label]="actionLabel"
  >
    @if (stopAction) {
      <svg lucideSquare [size]="16"></svg>
    } @else {
      <svg lucideArrowUp [size]="18"></svg>
    }
  </button>
  <app-model-controls></app-model-controls>
</div>
