name: macOS app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop-macos.yml']
    tags: ['desktop-v*']
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # A single builder invocation merges both architectures into latest-mac.yml.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "desktop-v" + require("./package.json").version) process.exit(1)'
      - run: npm ci --include=dev
        working-directory: desktop
      - run: npm run prepare:runtime
        working-directory: desktop
      - name: Test desktop
        working-directory: desktop
        run: npm test 2>&1 | tee "$RUNNER_TEMP/desktop-tests.log"
      - name: Build both Mac architectures
        working-directory: desktop
        run: npx electron-builder --mac dmg zip --arm64 --x64 --config.mac.identity=- --publish never 2>&1 | tee "$RUNNER_TEMP/desktop-build.log"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged signatures and native Electron launch
        working-directory: desktop
        run: node scripts/verify-mac-signing.cjs
      - name: Report packaging failure
        if: failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'desktop-build.log'
          if report.exists():
              detail = '\n'.join(report.read_text().splitlines()[-45:])
              detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::{detail}')
      - name: Test packaged runtime and folder isolation
        working-directory: desktop
        run: DESKTOP_TEST_EXECUTABLE="$PWD/release/mac-arm64/AI Router.app/Contents/MacOS/AI Router" DESKTOP_TEST_RUNTIME="$PWD/release/mac-arm64/AI Router.app/Contents/Resources/runner" npm test 2>&1 | tee "$RUNNER_TEMP/desktop-tests.log"
      - name: Report test failures
        if: failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'desktop-tests.log'
          if report.exists():
              lines = report.read_text().splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('not ok'):
                      detail = '\n'.join(lines[max(0, i - 8):i + 90])
                      detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::error::{detail}')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AI-Router-macOS
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml
      - name: Publish manual-install release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" desktop/release/*.dmg desktop/release/*.zip desktop/release/*.blockmap desktop/release/latest-mac.yml --verify-tag --title "AI Router ${GITHUB_REF_NAME#desktop-v}" --notes "Установка вручную: скачайте DMG для своего Mac, завершите AI Router через Cmd+Q и замените приложение в папке Программы. Эта сборка не подписана Developer ID и не заверена Apple. Проверка новых версий встроена; установка обновлений вручную."
