<div class="app-layout" [class.gesture-active]="dragging()"
  [class.drawer-visible]="vm.layoutService.mobileMenu() || dragging()"
  [style.--drawer-offset]="drawerOffset() === null ? null : drawerOffset() + 'px'"
  (touchstart)="startGesture($event)" (touchmove)="moveGesture($event)"
  (touchend)="endGesture()" (touchcancel)="cancelGesture()"
  (keydown.escape)="vm.layoutService.mobileMenu.set(false)">
  <div class="drawer-overlay" [class.visible]="vm.layoutService.mobileMenu() || dragging()"
    (click)="vm.layoutService.mobileMenu.set(false)" aria-hidden="true"></div>

  <!-- 1. LEFT MINI RAIL (DOCK) -->
  <app-navigation-rail [attr.inert]="mobile() && vm.layoutService.mobileMenu() ? '' : null"></app-navigation-rail>

  <!-- 2. SECONDARY SIDEBAR (260px COLLAPSIBLE) -->
  <app-chat-sidebar></app-chat-sidebar>

  <!-- 3. MAIN AREA -->
  <main class="main-content" [attr.inert]="mobile() && vm.layoutService.mobileMenu() ? '' : null">
    @if (vm.page() !== 'chat') {
      <nav class="mobile-bottom-nav" aria-label="Quick navigation">
        <button [class.active]="vm.page() === 'projects'" (click)="vm.showPage('projects')">
          <svg lucideFolder [size]="20"></svg><span>Projects</span>
        </button>
        <button [class.active]="vm.page() === 'sites'" (click)="vm.showPage('sites')">
          <svg lucideGlobe2 [size]="20"></svg><span>Websites</span>
        </button>
        <button (click)="vm.chatService.newSession()">
          <svg lucideSquarePen [size]="20"></svg><span>New task</span>
        </button>
        <button
          (click)="vm.layoutService.mobileMenu.set(true)"
          [attr.aria-expanded]="vm.layoutService.mobileMenu()"
        >
          <svg lucideMenu [size]="20"></svg><span>All sections</span>
        </button>
      </nav>
    }
    <!-- TOPBAR -->
    <app-page-header></app-page-header>

    <router-outlet></router-outlet>
  </main>
</div>
