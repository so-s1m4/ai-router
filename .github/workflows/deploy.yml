name: Check and deploy

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ai-router-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [backend, frontend, runner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.package }}
      - run: npm run build
        working-directory: ${{ matrix.package }}
      - if: matrix.package == 'frontend'
        run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: frontend
      - if: matrix.package != 'frontend'
        run: npm test
        working-directory: ${{ matrix.package }}

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production stack
        env:
          ADMIN_PASSWORD: ci-only
          SESSION_SECRET: ci-only
        run: docker compose -f compose.prod.yaml config --quiet
      - name: Validate runner stacks
        env:
          ROUTER_SERVER_URL: https://router.example.com
        run: |
          docker compose -f runner/compose.yaml config --quiet
          docker compose -f runner/compose.yaml -f runner/compose.build.yaml config --quiet
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix backend
      - run: npm ci --prefix runner
      - run: npm run build --prefix backend
      - run: npm run build --prefix runner
      - run: node --test tests/*.integration.mjs

  images:
    needs: [build, compose, integration]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image owner
        id: names
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/ai-router-backend:latest
            ghcr.io/${{ steps.names.outputs.owner }}/ai-router-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/ai-router-frontend:latest
            ghcr.io/${{ steps.names.outputs.owner }}/ai-router-frontend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - uses: docker/build-push-action@v6
        with:
          context: runner
          push: true
          build-args: |
            INSTALL_CODEX_CLI=true
            INSTALL_AGY_CLI=true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/ai-router-runner:latest
            ghcr.io/${{ steps.names.outputs.owner }}/ai-router-runner:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

  deploy:
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Ask Portainer to pull and redeploy
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          test -n "$PORTAINER_WEBHOOK_URL"
          curl --fail --silent --show-error \
            --request POST \
            --retry 3 \
            --max-time 120 \
            "$PORTAINER_WEBHOOK_URL"

  deploy-runner:
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Redeploy runner stack when configured
        env:
          PORTAINER_RUNNER_WEBHOOK_URL: ${{ secrets.PORTAINER_RUNNER_WEBHOOK_URL }}
        run: |
          if [ -n "$PORTAINER_RUNNER_WEBHOOK_URL" ]; then
            curl --fail --silent --show-error \
              --request POST \
              --retry 3 \
              --max-time 120 \
              "$PORTAINER_RUNNER_WEBHOOK_URL"
          fi
