name: Build and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-router-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix backend
      - run: npm ci --prefix runner
      - run: npm run build --prefix backend
      - run: npm run build --prefix runner
      - run: node --test tests/preview.integration.mjs
  images:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image owner
        id: names
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/ai-router-backend:latest
            ghcr.io/${{ steps.names.outputs.owner }}/ai-router-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/ai-router-frontend:latest
            ghcr.io/${{ steps.names.outputs.owner }}/ai-router-frontend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Ask Portainer to pull and redeploy
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          test -n "$PORTAINER_WEBHOOK_URL"
          curl --fail --silent --show-error \
            --request POST \
            --retry 3 \
            --max-time 120 \
            "$PORTAINER_WEBHOOK_URL"
