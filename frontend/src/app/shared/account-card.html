<button type="button" class="account-inline-row" [class]="vm.accountService.accountCardTheme(a)"
  (click)="details.emit(a)" aria-haspopup="dialog" [attr.aria-label]="'Details and settings for ' + a.name">
    <div class="account-identity">
      <div
        class="provider-badge-icon"
        [class.provider-gemini]="a.provider === 'antigravity'"
        [class.provider-chatgpt]="a.provider === 'chatgpt'"
        [class.provider-apikey]="a.authType === 'api_key'"
      >
        @if (a.authType === 'api_key') {
          <svg lucideKey [size]="20"></svg>
        } @else if (a.provider === 'codex') {
          <svg lucideBot [size]="20"></svg>
        } @else if (a.provider === 'antigravity') {
          <svg lucideSparkles [size]="20"></svg>
        } @else {
          <svg lucideGlobe2 [size]="20"></svg>
        }
      </div>
      <div class="account-title-group">
        <span class="account-name" [title]="a.name">{{ a.name }}</span>
        <div class="account-detail-chips">
          <span class="account-provider-chip">{{
            a.authType === 'api_key' ? (a.provider === 'cerebras' ? 'Cerebras API' : a.provider === 'openrouter' ? 'OpenRouter API' : 'OpenAI API') : vm.providerLabel(a.provider)
          }}</span>
          @if (a.shared) {
            <span class="account-shared-chip">Shared</span>
          }
        </div>
      </div>
    </div>

  <span class="account-inline-quota">
    @if (a.limit.primary; as primary) {
      {{ vm.windowLabel(primary) }}: {{ vm.remaining(primary) }}
      @if (a.limit.secondary; as secondary) {
        · {{ vm.windowLabel(secondary) }}: {{ vm.remaining(secondary) }}
      }
    } @else if (a.limit.secondary; as secondary) {
      {{ vm.windowLabel(secondary) }}: {{ vm.remaining(secondary) }}
    } @else {
      {{ vm.limitLabel(a) }}
    }
  </span>
  <span class="badge" [class]="vm.accountService.accountStatusBadge(a).class">
    {{ vm.accountService.accountStatusBadge(a).label }}
  </span>
  <svg lucideChevronRight [size]="16" class="account-row-chevron"></svg>
</button>
